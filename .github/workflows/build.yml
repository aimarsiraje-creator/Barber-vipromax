name: Build BARBER VIPROMAX apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'barber_vipromax.zip'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unpack project
        run: unzip -q barber_vipromax.zip

      - name: Put Supabase keys
        working-directory: barber_vipromax
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          sed -i "s|PUT_YOUR_SUPABASE_URL|${SUPABASE_URL}|; s|PUT_YOUR_SUPABASE_ANON_KEY|${SUPABASE_ANON_KEY}|" packages/core/lib/core.dart

      - name: Prepare the three apps
        working-directory: barber_vipromax
        run: bash setup.sh

      - name: Build Android APKs
        working-directory: barber_vipromax
        run: |
          mkdir -p out
          (cd apps/customer && flutter build apk --release)
          (cd apps/barber && flutter build apk --release)
          (cd apps/owner && flutter build apk --release)
          cp apps/customer/build/app/outputs/flutter-apk/app-release.apk out/1-BarberVIPROMAX-Customer.apk
          cp apps/barber/build/app/outputs/flutter-apk/app-release.apk out/2-BarberVIPROMAX-Barber.apk
          cp apps/owner/build/app/outputs/flutter-apk/app-release.apk out/3-BarberVIPROMAX-Owner.apk

      - name: Build web apps (install on iPhone and Android from a link)
        working-directory: barber_vipromax
        run: |
          BASE="/${{ github.event.repository.name }}/"
          (cd apps/customer && flutter build web --release --base-href "$BASE")
          (cd apps/barber && flutter build web --release --base-href "${BASE}barber/")
          mkdir -p site/barber
          cp -r apps/customer/build/web/. site/
          cp -r apps/barber/build/web/. site/barber/

      - name: Publish APKs as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-${{ github.run_number }}
          name: BARBER VIPROMAX apps (build ${{ github.run_number }})
          files: barber_vipromax/out/*.apk

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: barber_vipromax/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
